[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -DCORE_DEBUG_LEVEL=1

; Host-side tests for the pure math in src/levelmath.h:  pio test -e native
[env:native]
platform = native
build_flags = -I src
test_framework = unity
