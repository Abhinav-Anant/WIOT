; ESP32-S3-DevKitC-1 with WROOM-1 N16R8 -- 16 MB quad flash, 8 MB octal PSRAM.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; The stock board definition assumes 8 MB flash. N16R8 has 16 MB, so say so --
; otherwise you lose half the chip and the partition table won't match.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; PSRAM is left OFF: this firmware peaks around 50 KB of RAM, so 8 MB of octal
; PSRAM would only add boot time and idle current. Its pins (GPIO33-37) are
; reserved by the module either way. To enable it later, add:
;   board_build.arduino.memory_type = qio_opi
;   build_flags = -DBOARD_HAS_PSRAM

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -DCORE_DEBUG_LEVEL=1

; Serial goes to UART0 (GPIO43/44) -- use the port silkscreened "UART".
; To use the native "USB" port instead, add -DARDUINO_USB_CDC_ON_BOOT=1 above.

; Host-side tests for the pure math in src/levelmath.h:  pio test -e native
[env:native]
platform = native
build_flags = -I src
test_framework = unity
